<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Registration — SecureVote Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 40px auto;
        }
        .preview-card {
            background: linear-gradient(145deg, #2A1D15, #1C120C);
            border: 1px solid rgba(200, 134, 42, 0.25);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(200, 134, 42, 0.1);
            border-radius: var(--radius-xl);
            padding: 40px;
            position: relative;
        }
        .preview-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--gradient-1);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }
        .page-header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .info-item {
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .ai-panel {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(200, 134, 42, 0.15);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/admin-panel/" class="nav-brand">
                <div class="logo">⚙️</div>
                Admin Portal
            </a>
            <div class="nav-user">
                <span class="user-name" id="admin-name">Loading...</span>
                <button class="btn btn-sm btn-secondary" onclick="clearAuth(); window.location.href='/'">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container page-container">
        <div class="preview-card" id="preview-content">
            <div class="page-header-flex">
                <h1 style="font-size: 2rem; margin: 0;" id="user-title">📋 Preview Registration</h1>
                <a href="/admin-panel/" class="btn btn-secondary">← Back</a>
            </div>

            <div style="text-align:center; padding:60px;"><div class="spinner"></div><p style="margin-top:20px; color:var(--text-muted);">Loading details...</p></div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        const user = getUser();
        if (!user || (user.role !== 'admin' && user.role !== 'officer')) {
            window.location.href = '/admin-login/';
        }
        document.getElementById('admin-name').textContent = user.first_name || 'Admin';

        const urlParams = new URLSearchParams(window.location.search);
        const reqId = urlParams.get('id');
        const mode = urlParams.get('mode') || 'village_admin';

        if (!reqId) {
            document.getElementById('preview-content').innerHTML = '<div class="page-header-flex"><h1 style="font-size:2rem;margin:0;">Error</h1><a href="/admin-panel/" class="btn btn-secondary">← Back</a></div><p>No request ID provided.</p>';
        } else {
            loadDetails();
        }

        async function loadDetails() {
            try {
                const token = getTokens()?.access;
                // Fetch both pending lists to find the record (lazy approach but works for small datasets)
                let r = null;
                const endpoints = ['/api/auth/registration-requests/?status=pending_village_admin', '/api/auth/registration-requests/?status=pending_voter_admin'];
                
                for (const url of endpoints) {
                    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                    const list = await res.json();
                    const found = list.find(x => x.id == reqId);
                    if (found) { r = found; break; }
                }

                if (!r) throw new Error("Request not found or you don't have permission to view it.");

                // Render content
                renderContent(r);

            } catch (e) {
                document.getElementById('preview-content').innerHTML = `<div class="page-header-flex"><h1 style="font-size:2rem;margin:0;">Error</h1><a href="/admin-panel/" class="btn btn-secondary">← Back</a></div><p style="color:var(--danger)">${e.message}</p>`;
            }
        }

        function aiScoreBadge(score) {
            if (score >= 80) return `<span class="badge" style="background:#22c55e;color:#fff">${score}% Genuine</span>`;
            if (score >= 50) return `<span class="badge" style="background:#f59e0b;color:#fff">${score}% Needs Review</span>`;
            return `<span class="badge" style="background:#ef4444;color:#fff">${score}% Suspicious</span>`;
        }

        function renderContent(r) {
            document.title = `${r.full_name} — Preview Registration`;
            
            let aiChecksHtml = '';
            if (r.ai_details && r.ai_details.checks) {
                const checks = r.ai_details.checks;
                aiChecksHtml = '<div style="margin-top:16px;background:rgba(0,0,0,.2);border-radius:10px;padding:16px">';
                aiChecksHtml += '<h4 style="margin-bottom:12px;font-size:0.95rem;">🤖 AI Check Breakdown:</h4>';
                Object.entries(checks).forEach(([key, val]) => {
                    const pct = Math.round((val.points / val.max) * 100);
                    const col = pct >= 80 ? '#22c55e' : pct >= 50 ? '#f59e0b' : '#ef4444';
                    aiChecksHtml += `<div style="margin-bottom:12px;font-size:.9rem">`;
                    aiChecksHtml += `<div style="display:flex;justify-content:space-between;margin-bottom:4px">
                        <span style="text-transform:capitalize;font-weight:600">${key.replace('_',' ')}</span>
                        <span style="color:${col};font-weight:700">${val.points}/${val.max}</span>
                    </div>`;
                    aiChecksHtml += val.messages.map(m => `<div style="font-size:.8rem;color:var(--text-muted);margin-left:8px">• ${m}</div>`).join('');
                    aiChecksHtml += '</div>';
                });
                aiChecksHtml += '</div>';
            }

            const scoreHtml = `<div class="ai-panel">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <h3 style="margin:0;">AI Genuineness Score</h3>
                    ${aiScoreBadge(r.ai_score)}
                </div>
                <div style="height:12px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:12px 0">
                    <div style="height:100%;width:${r.ai_score}%;background:${r.ai_score>=80?'#22c55e':r.ai_score>=50?'#f59e0b':'#ef4444'};border-radius:6px;transition:width 1s ease-out"></div>
                </div>
                <p style="font-size:0.9rem;color:var(--text-secondary);line-height:1.5;">${r.ai_details?.summary||'No summary provided.'}</p>
                ${aiChecksHtml}
            </div>`;

            let actionButtons = '';
            if (mode === 'village_admin') {
                actionButtons = `
                    <button class="btn btn-primary" onclick="forwardRequest(${r.id})">📤 Forward to Voter Administrative</button>
                    <button class="btn btn-secondary" style="color:var(--error)" onclick="rejectRequest(${r.id},'village_admin')">❌ Reject</button>
                `;
            } else {
                actionButtons = `
                    <button class="btn btn-primary" style="background:linear-gradient(135deg,#22c55e,#16a34a)" onclick="approveRequest(${r.id})">✅ Approve & Register</button>
                    <button class="btn btn-secondary" style="color:var(--error)" onclick="rejectRequest(${r.id},'voter_admin')">❌ Reject</button>
                `;
            }

            document.getElementById('preview-content').innerHTML = `
                <div class="page-header-flex">
                    <h1 style="font-size: 2rem; margin: 0;">📋 Review Registration</h1>
                    <a href="/admin-panel/" class="btn btn-secondary">← Back</a>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Full Name</div>
                        <div class="info-value">${r.full_name}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Voter ID</div>
                        <div class="info-value">${r.voter_id}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Email Address</div>
                        <div class="info-value">${r.email}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Aadhaar (Last 4)</div>
                        <div class="info-value">****${r.aadhaar_last4}</div>
                    </div>
                    <div class="info-item" style="grid-column: span 2;">
                        <div class="info-label">Location</div>
                        <div class="info-value">${r.village}, ${r.district||''}, ${r.state}</div>
                    </div>
                </div>

                ${r.village_admin_notes ? `<div class="info-item" style="margin-bottom:24px"><div class="info-label">Village Admin Notes</div><div class="info-value">${r.village_admin_notes}</div></div>` : ''}

                ${scoreHtml}

                <div style="background:rgba(0,0,0,0.15); border: 1px solid var(--border); padding:24px; border-radius:var(--radius-lg);">
                    <h3 style="margin-bottom:16px;">Administrative Action</h3>
                    <div class="form-group">
                        <label class="form-label">Add Notes (Optional)</label>
                        <textarea id="action-notes" class="form-input" rows="3" placeholder="Enter remarks before taking action..."></textarea>
                    </div>
                    <div style="display:flex;gap:16px;margin-top:20px;">
                        ${actionButtons}
                    </div>
                </div>
            `;
        }

        async function forwardRequest(id) {
            const notes = document.getElementById('action-notes').value;
            const token = getTokens()?.access;
            try {
                const res = await fetch(`/api/auth/registration-requests/${id}/forward/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes })
                });
                if (!res.ok) throw new Error("Failed to forward request.");
                showToast('✅ Forwarded to Voter Administrative!', 'success');
                setTimeout(() => window.location.href='/admin-panel/', 1500);
            } catch(e) { showToast(e.message, 'error'); }
        }

        async function approveRequest(id) {
            if (!confirm('Approve this voter? They will be added to the Voter Roll.')) return;
            const notes = document.getElementById('action-notes').value;
            const token = getTokens()?.access;
            try {
                const res = await fetch(`/api/auth/registration-requests/${id}/approve/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes })
                });
                if (!res.ok) throw new Error("Failed to approve request.");
                showToast('✅ Voter approved and registered!', 'success');
                setTimeout(() => window.location.href='/admin-panel/', 1500);
            } catch(e) { showToast(e.message, 'error'); }
        }

        async function rejectRequest(id, modeParam) {
            if (!confirm('Reject this request? This action is permanent.')) return;
            const notes = document.getElementById('action-notes').value;
            const token = getTokens()?.access;
            try {
                const res = await fetch(`/api/auth/registration-requests/${id}/reject/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes })
                });
                if (!res.ok) throw new Error("Failed to reject request.");
                showToast('❌ Request rejected.', 'success');
                setTimeout(() => window.location.href='/admin-panel/', 1500);
            } catch(e) { showToast(e.message, 'error'); }
        }
    </script>
</body>
</html>
